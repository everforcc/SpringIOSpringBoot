          url: jdbc:mysql://192.168.1.132:3306/box_mall?useUnicode=true&characterEncoding=UTF-8&&serverTimezone=GMT # 编码和时区
        dd152:
          type: ${spring.datasource.type}
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: root
          password: znkj123456
          url: jdbc:mysql://192.168.1.152:3306/box_mall?useUnicode=true&characterEncoding=UTF-8&&serverTimezone=GMT # 编码和时区
    #   数据源其他配置， 如果用 com.alibaba 不同版本可能写法不一样，初次配置输出测试,
      druid:
        # 如果用 druid-spring-boot-starter 则可以一一对应 DruidDataSourceWrapper
        initialSize: 5
        minIdle: 5
        maxActive: 20
        maxWait: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1 FROM DUAL
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        poolPreparedStatements: true
        # 版本不同此处配置也不相同，现在是历史配置
        #   配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
        #filters: stat,wall,log4j 旧版配置
        #filters:
        #  commons-log.connection-logger-name: stat,wall,log4j # 新版配置
        filters: stat,wall # 2021暂时去掉  ,log4j
        maxPoolPreparedStatementPerConnectionSize: 20
        useGlobalDataSourceStat: true
        connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500
mybatis:
  # 指定全局配置文件位置  便于管理和扫描 config-location 和 configuration不能同时使用
  type-aliases-package: cn.cc.**.dto
  mapper-locations: classpath:mybatis/mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true # 驼峰命名法问题，等效配置文件
