<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>小说章节内容</title>
    <style>
        #chapter-content {
            font-size: 1.2rem;
            line-height: 1.8;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 30px;
            white-space: pre-wrap; /* 保留换行和空格 */
            font-family: 'Georgia', serif; /* 使用更易读的字体 */
            color: #333; /* 设置文字颜色 */
        }
        .btn {
            margin-right: 10px;
            padding: 10px 20px;
            font-size: 1.1rem;
        }
        .disabled {
            pointer-events: none;
            opacity: 0.6;
        }
        /* 新增样式 */
        .floating-buttons {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .floating-buttons .btn {
            margin-bottom: 0; /* 去除按钮之间的空隙 */
            background-color: #f0f0f0; /* 浅灰色背景 */
            color: #333; /* 文字颜色 */
            width: 100px; /* 统一按钮宽度 */
            border: none; /* 去除边框 */
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <p id="chapter-content"></p>
        <!-- 将按钮移动到悬浮容器中 -->
        <div class="floating-buttons">
            <a href="#" id="bookshelf" class="btn btn-primary">书架</a>
            <a id="prev-chapter" href="#" class="btn btn-primary">上一章</a>
            <a href="#" id="table-of-contents-chapter" class="btn btn-primary">目录</a>
            <a id="next-chapter" href="#" class="btn btn-primary">下一章</a>
            <a href="#" id="to-top" class="btn btn-primary">到顶部</a>
            <a href="#" id="to-bottom" class="btn btn-primary">到底部</a>
        </div>
    </div>
    <script>
        $(document).ready(function() {
            const urlParams = new URLSearchParams(window.location.search);
            const chapterId = urlParams.get('chapterId');
            $.ajax({
                url: `/api/chapters/${chapterId}`,
                method: 'GET',
                success: function(data) {
                    $('#chapter-content').text(data.content);
                    if (data.prevChapterId) {
                        $('#prev-chapter').attr('href', `novel_chapter_content.html?chapterId=${data.prevChapterId}`);
                    } else {
                        $('#prev-chapter').addClass('disabled');
                    }
                    if (data.nextChapterId) {
                        $('#next-chapter').attr('href', `novel_chapter_content.html?chapterId=${data.nextChapterId}`);
                    } else {
                        $('#next-chapter').addClass('disabled');
                    }
                },
                error: function() {
                    alert('获取章节内容失败');
                }
            });

            $('#table-of-contents-chapter').on('click', function() {
                $.ajax({
                    url: `/api/chapters/${chapterId}/bookId`,
                    method: 'GET',
                    success: function(bookId) {
                        window.location.href = `novel_chapter_list.html?bookId=${bookId}`;
                    },
                    error: function() {
                        alert('获取书籍ID失败');
                    }
                });
            });

            $('#bookshelf').on('click', function() {
                window.location.href = 'bookshelf_list.html?bookId=${bookId}';
            });

            $('#to-top').on('click', function() {
                $('html, body').animate({ scrollTop: 0 }, 'smooth');
            });

            $('#to-bottom').on('click', function() {
                $('html, body').animate({ scrollTop: $(document).height() }, 'smooth');
            });
        });
    </script>
</body>
</html>
