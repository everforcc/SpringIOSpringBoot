<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>小说章节内容</title>
    <style>
        #chapter-content {
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <p id="chapter-content"></p>
        <a id="prev-chapter" href="#" class="btn btn-primary">上一章</a>
        <a id="next-chapter" href="#" class="btn btn-primary">下一章</a>
        <a href="#" id="table-of-contents-chapter" class="btn btn-primary">目录</a>
        <a href="#" id="bookshelf" class="btn btn-primary">书架</a>
    </div>
    <script>
        $(document).ready(function() {
            const urlParams = new URLSearchParams(window.location.search);
            const chapterId = urlParams.get('chapterId');
            $.ajax({
                url: `/api/chapters/${chapterId}`,
                method: 'GET',
                success: function(data) {
                    $('#chapter-content').text(data.content);
                    if (data.prevChapterId) {
                        $('#prev-chapter').attr('href', `novel_chapter_content.html?chapterId=${data.prevChapterId}`);
                    } else {
                        $('#prev-chapter').addClass('disabled');
                    }
                    if (data.nextChapterId) {
                        $('#next-chapter').attr('href', `novel_chapter_content.html?chapterId=${data.nextChapterId}`);
                    } else {
                        $('#next-chapter').addClass('disabled');
                    }
                },
                error: function() {
                    alert('获取章节内容失败');
                }
            });

            $('#table-of-contents-chapter').on('click', function() {
                $.ajax({
                    url: `/api/chapters/${chapterId}/bookId`,
                    method: 'GET',
                    success: function(bookId) {
                        window.location.href = `novel_chapter_list.html?bookId=${bookId}`;
                    },
                    error: function() {
                        alert('获取书籍ID失败');
                    }
                });
            });

            $('#bookshelf').on('click', function() {
                window.location.href = 'bookshelf_list.html?bookId=${bookId}';
            });
        });
    </script>
</body>
</html>
