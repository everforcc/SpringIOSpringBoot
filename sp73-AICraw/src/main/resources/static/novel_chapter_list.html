<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>小说章节列表</title>
</head>
<body>
    <div class="container mt-5">
        <h1>章节列表</h1>
        <ul id="chapter-list" class="list-group"></ul>
    </div>
    <script>
        $(document).ready(function() {
            const urlParams = new URLSearchParams(window.location.search);
            const bookId = urlParams.get('bookId');
            $.ajax({
                url: `/api/books/${bookId}/chapters`,
                method: 'GET',
                success: function(data) {
                    data.forEach(function(chapter) {
                        $('#chapter-list').append(`
                            <li class="list-group-item">
                                <span>章节序号: ${chapter.order}</span>
                                <span>章节名称: ${chapter.name}</span>
                                <a href="novel_chapter_content.html?chapterId=${chapter.id}" class="btn btn-primary">查看内容</a>
                            </li>
                        `);
                    });
                },
                error: function() {
                    alert('获取章节列表失败');
                }
            });
        });
    </script>
</body>
</html>
