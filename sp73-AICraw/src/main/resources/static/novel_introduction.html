<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>小说简介</title>
    <style>
        #book-pic {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        #book-name {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #333;
            font-family: 'Georgia', serif;
        }
        #book-description {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #333;
            margin-bottom: 30px;
            font-family: 'Georgia', serif;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            white-space: pre-wrap;
        }
        .btn {
            margin-right: 10px;
            padding: 10px 20px;
            font-size: 1.1rem;
            background-color: #f0f0f0;
            color: #333;
            width: 100px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 id="book-name"></h1>
        <img id="book-pic" src="" alt="封面图" class="img-fluid">
        <p id="book-description"></p>
        <a href="#" id="table-of-contents" class="btn btn-primary">目录</a>
    </div>
    <script>
        $(document).ready(function() {
            const bookId = 1; // 假设书籍ID为1
            $.ajax({
                url: `/api/books/${bookId}`,
                method: 'GET',
                success: function(data) {
                    $('#book-name').text(data.name);
                    $('#book-pic').attr('src', data.pic);
                    $('#book-description').text(data.description);
                },
                error: function() {
                    alert('获取小说简介失败');
                }
            });

            $('#table-of-contents').on('click', function() {
                window.location.href = `novel_chapter_list.html?bookId=${bookId}`;
            });
        });
    </script>
</body>
</html>
