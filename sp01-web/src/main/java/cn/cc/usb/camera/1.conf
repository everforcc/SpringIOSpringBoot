server {
    listen 80;
    server_name 192.168.1.100; # 局域网IP

    location / {
        root /usr/share/nginx/html; # 前端静态页面目录
        index index.html;
    }

    location /camera/ {
        proxy_pass http://localhost:8080/camera/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}