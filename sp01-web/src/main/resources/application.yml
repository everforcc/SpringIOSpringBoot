spring:
  thymeleaf:
    cache: false
    # 使用自定义的线程池
    # 如果使用默认。修改下面配置
#  task:
#    execution:
#      pool:
#        max-size: 18
#        core-size: 6
#        keep-alive: 30s
#        queue-capacity: 1000
#        allow-core-thread-timeout: true
#      thread-name-prefix: aa-thread-
  info:
    git:
      encoding: UTF-8
#  jackson:
#    date-format: yyyy-MM-dd
#    time-zone: GMT+8

# 优雅关闭应用
# /monitor/shutdown
management:
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*" # 打开所有的监控点 # "shutdown"
      base-path: /monitor

server:
  port: 8001
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: -1
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256

